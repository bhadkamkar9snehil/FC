name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore .\FC.sln

      - name: Build
        run: dotnet build .\FC.sln -c Release --no-restore

      - name: Publish single-file Windows build
        shell: pwsh
        run: .\scripts\Publish.ps1

      - name: Upload FC executable
        uses: actions/upload-artifact@v4
        with:
          name: FC-win-x64
          path: artifacts/publish/
          if-no-files-found: error
